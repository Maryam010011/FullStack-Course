<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Workshop Registration Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Campus Workshop Registration Portal</h1>
    <p>University Training Day &middot; Task 2: interactive selection with ES6</p>
  </header>

  <main class="page layout">
    <section aria-labelledby="ws-heading">
      <h2 id="ws-heading">Available workshops</h2>
      <div id="workshop-list" class="card-grid"></div>
    </section>

    <aside class="panel" aria-labelledby="sum-heading">
      <h2 id="sum-heading">Your selection</h2>
      <p id="selection-count" class="muted"></p>
      <ul id="selection-list" class="summary-list"></ul>
      <p class="total-row">Total fee: <strong id="selection-total">Rs 0</strong></p>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <h3 class="small-heading">Try the ES6 helpers</h3>
      <div class="btn-row">
        <button type="button" class="btn secondary" data-action="quick-valid">Quick pick: W1 + W2</button>
        <button type="button" class="btn secondary" data-action="quick-bad">Try: W1, W1, W9, W2, W4</button>
        <button type="button" class="btn ghost" data-action="clear">Clear</button>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
