
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Showcase</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <section class="team">

        <h2 class="team-title">Meet the Team</h2>

        <div class="card-row">

            <!-- Card 1 -->
            <div class="card">
                <span class="badge">Featured</span>

                <div class="avatar"></div>

                <h3>Ayesha Khan</h3>

                <p class="role">Frontend Developer</p>
            </div>


            <!-- Card 2 -->
            <div class="card">

                <div class="avatar"></div>

                <h3>Bilal Ahmed</h3>

                <p class="role">UI/UX Designer</p>
            </div>


            <!-- Card 3 -->
            <div class="card">

                <div class="avatar"></div>

                <h3>Sara Malik</h3>

                <p class="role">Backend Developer</p>
            </div>

        </div>


        <!-- Bootstrap Flex Utilities -->
        <div class="actions d-flex flex-wrap justify-content-center gap-3">

            <button class="btn btn-outline-primary">Contact</button>

            <button class="btn btn-outline-primary">View Portfolio</button>

            <button class="btn btn-outline-primary">Share</button>

        </div>

    </section>

</body>

</html>
